<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>یه سوال مهم ❤️</title>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    h2 { color: #d63384; margin-bottom: 20px; }
    p { color: #444; margin-bottom: 15px; font-size: 16px; }
    textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 2px solid #ffb6c1;
      border-radius: 10px;
      outline: none;
      resize: vertical;
      min-height: 90px;
      text-align: right;
      font-size: 14px;
    }
    .btn-group { display: flex; flex-direction: column; gap: 10px; align-items: center; }
    button {
      width: 100%;
      background: #ff6b81;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover { background: #ff4757; }
    #noBtn {
      background: #a4b0be;
    }
    #noBtn:hover { background: #747d8c; }
    .btn-send { background: #2ed573; margin-top: 10px; }
    .btn-send:hover { background: #26af5f; }
    #noteStep { display: none; margin-top: 15px; }
    #result { margin-top: 20px; font-size: 17px; color: #2ed573; display: none; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>❤️ یه سوال برای تو ❤️</h2>
    
    <div id="step1">
      <p>چقدر دوسم داری؟ 🥹</p>
      <div class="btn-group">
        <button onclick="selectOption('بی‌نهایت ♾️❤️')">بی‌نهایت ♾️❤️</button>
        <button onclick="selectOption('یکم کمتر از بی‌نهایت 🤏🥰')">یکم کمتر از بی‌نهایت 🤏🥰</button>
        <button id="noBtn" onclick="shrinkNoBtn()">دوست ندارم 💔</button>
      </div>
    </div>

    <!-- مرحله ثبت متن دلخواه -->
    <div id="noteStep">
      <p>حالا که دوسم داری، یه متن برام بنویس که روت نمی‌شد شاید بهم بگی: 🫣💬</p>
      <textarea id="customNote" placeholder="هرچی تو دلت هست بنویس..."></textarea>
      <button class="btn-send" onclick="sendFinalData()">ارسال برای عشقم 💌</button>
    </div>

    <!-- پیام موفقیت -->
    <div id="result">جوابت با عشق فرستاده شد! 💕</div>
  </div>

  <script>
    let selectedAnswer = '';
    let scale = 1;

    function shrinkNoBtn() {
      const btn = document.getElementById('noBtn');
      scale -= 0.25;
      
      btn.innerText = 'بیشتر فکر کن! 🧐';
      
      if (scale <= 0.1) {
        btn.style.display = 'none';
      } else {
        btn.style.transform = `scale(${scale})`;
      }
    }

    function selectOption(answer) {
      selectedAnswer = answer;
      document.getElementById('step1').style.display = 'none';
      document.getElementById('noteStep').style.display = 'block';
    }

    async function sendFinalData() {
      const note = document.getElementById('customNote').value || 'متنی نوشته نشد!';
      
      const combinedAnswer = `${selectedAnswer}\n\n📝 **متن دلی:**\n${note}`;

      try {
        const response = await fetch('/api/index.py', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: 'پارتنر عزیز', answer: combinedAnswer })
        });
        
        if (response.ok) {
          document.getElementById('noteStep').style.display = 'none';
          document.getElementById('result').style.display = 'block';
        } else {
          alert('خطایی رخ داد، دوباره تلاش کن!');
        }
      } catch (err) {
        alert('خطا در ارتباط با سرور.');
      }
    }
  </script>
</body>
</html>
