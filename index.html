<!DOCTYPE html>  
<html lang="fa" dir="rtl">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>Love Pro Max</title>  
  <style>  
    :root {  
      --bg-color: #000000;  
      --card-bg: rgba(255, 255, 255, 0.08);  
      --card-border: rgba(255, 255, 255, 0.15);  
      --text-main: #f5f5f7;  
      --text-sub: #86868b;  
      --accent-color: #0071e3;  
      --accent-hover: #0077ed;  
    }  
  
    * {  
      box-sizing: border-box;  
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;  
      margin: 0;  
      padding: 0;  
    }  
  
    body {  
      background-color: var(--bg-color);  
      color: var(--text-main);  
      min-height: 100vh;  
      display: flex;  
      justify-content: center;  
      align-items: center;  
      padding: 20px;  
    }  
  
    .apple-card {  
      background: var(--card-bg);  
      backdrop-filter: blur(20px);  
      -webkit-backdrop-filter: blur(20px);  
      border: 1px solid var(--card-border);  
      border-radius: 28px;  
      padding: 40px 30px;  
      max-width: 420px;  
      width: 100%;  
      text-align: center;  
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);  
      animation: fadeIn 0.8s ease-out;  
    }  
  
    .apple-badge {  
      font-size: 12px;  
      font-weight: 600;  
      letter-spacing: 1px;  
      color: #bf5af2;  
      text-transform: uppercase;  
      margin-bottom: 8px;  
    }  
  
    h1 {  
      font-size: 32px;  
      font-weight: 700;  
      letter-spacing: -0.5px;  
      margin-bottom: 10px;  
      background: linear-gradient(180deg, #ffffff 0%, #a1a1a6 100%);  
      -webkit-background-clip: text;  
      -webkit-text-fill-color: transparent;  
    }  
  
    p.subtitle {  
      font-size: 16px;  
      color: var(--text-sub);  
      margin-bottom: 30px;  
      line-height: 1.4;  
    }  
  
    .btn-container {  
      display: flex;  
      flex-direction: column;  
      gap: 12px;  
      align-items: center;  
    }  
  
    .apple-btn {  
      width: 100%;  
      padding: 14px 20px;  
      border-radius: 980px;  
      font-size: 15px;  
      font-weight: 500;  
      border: none;  
      cursor: pointer;  
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);  
      outline: none;  
    }  
  
    .btn-primary {  
      background: var(--accent-color);  
      color: #ffffff;  
    }  
  
    .btn-primary:hover {  
      background: var(--accent-hover);  
      transform: scale(1.02);  
    }  
  
    .btn-secondary {  
      background: rgba(255, 255, 255, 0.1);  
      color: var(--text-main);  
    }  
  
    .btn-secondary:hover {  
      background: rgba(255, 255, 255, 0.2);  
      transform: scale(1.02);  
    }  
  
    #noBtn {  
      background: rgba(255, 69, 58, 0.15);  
      color: #ff453a;  
    }  
  
    textarea {  
      width: 100%;  
      background: rgba(255, 255, 255, 0.05);  
      border: 1px solid var(--card-border);  
      border-radius: 16px;  
      padding: 15px;  
      color: var(--text-main);  
      font-size: 15px;  
      outline: none;  
      resize: vertical;  
      min-height: 100px;  
      margin-bottom: 20px;  
      text-align: right;  
    }  
  
    textarea:focus {  
      border-color: var(--accent-color);  
    }  
  
    #noteStep, #result, #thinkMoreText {  
      display: none;  
    }  
  
    #thinkMoreText {  
      margin-top: 15px;  
      font-size: 14px;  
      color: #ff453a;  
    }  
  
    #result {  
      margin-top: 20px;  
      font-size: 18px;  
      font-weight: 600;  
      color: #30d158;  
    }  
  
    @keyframes fadeIn {  
      from { opacity: 0; transform: translateY(20px); }  
      to { opacity: 1; transform: translateY(0); }  
    }  
  </style>  
</head>  
<body>  
  
  <div class="apple-card">  
    <div class="apple-badge">Love Edition</div>  
      
    <div id="step1">  
      <h1>یک سوال مهم.</h1>  
      <p class="subtitle">طراحی‌شده برای سنجش میزان علاقه شما.</p>  
  
      <div class="btn-container">  
        <button class="apple-btn btn-primary" onclick="selectOption('بی‌نهایت ♾️')">بی‌نهایت ♾️</button>  
        <button class="apple-btn btn-secondary" onclick="selectOption('یکم کمتر از بی‌نهایت 🤏')">یکم کمتر از بی‌نهایت 🤏</button>  
        <button id="noBtn" class="apple-btn" onclick="shrinkNoBtn()">دوست ندارم 💔</button>  
      </div>  
      <div id="thinkMoreText">بیشتر فکر کن... 🧐</div>  
    </div>  
  
    <div id="noteStep">  
      <h1>یادداشت دلی.</h1>  
      <p class="subtitle">چیزی که هیچ‌وقت فرصت نشد بگی را اینجا بنویس.</p>  
      <textarea id="customNote" placeholder="متن خود را بنویسید..."></textarea>  
      <button class="apple-btn btn-primary" onclick="sendFinalData()">ارسال پیام 💌</button>  
    </div>  
  
    <div id="result">پاسخ شما با موفقیت ثبت شد. 💕</div>  
  </div>  
  
  <script>  
    var selectedAnswer = '';  
    var scale = 1;  
  
    function shrinkNoBtn() {  
      var btn = document.getElementById('noBtn');  
      var text = document.getElementById('thinkMoreText');  
        
      text.style.display = 'block';  
      scale = scale - 0.25;  
        
      if (scale <= 0.1) {  
        btn.style.display = 'none';  
      } else {  
        btn.style.transform = 'scale(' + scale + ')';  
      }  
    }  
  
    function selectOption(answer) {  
      selectedAnswer = answer;  
      document.getElementById('step1').style.display = 'none';  
      document.getElementById('noteStep').style.display = 'block';  
    }  
  
    function sendFinalData() {  
      var note = document.getElementById('customNote').value || 'متنی نوشته نشد!';  
      var combinedAnswer = selectedAnswer + '\n\n📝 **متن دلی:**\n' + note;  
  
      fetch('/api/index.py', {  
        method: 'POST',  
        headers: { 'Content-Type': 'application/json' },  
        body: JSON.stringify({ name: 'پارتنر عزیز', answer: combinedAnswer })  
      })  
      .then(function(response) {  
        if (response.ok) {  
          document.getElementById('noteStep').style.display = 'none';  
          document.getElementById('result').style.display = 'block';  
        } else {  
          alert('خطایی رخ داد!');  
        }  
      })  
      .catch(function(err) {  
        alert('خطا در ارتباط با سرور.');  
      });  
    }  
  </script>  
</body>  
</html>
